  essential: [
    { zero: "The course includes learning objectives, but they may be vague, overly broad, or difficult to measure. Objectives do not include action-oriented verbs, making it unclear what students are expected to achieve. There is little to no connection between the objectives and course assessments.", one: "The course presents clearly written learning objectives that include measurable components. Objectives align with course assessments, ensuring that students understand how they will be evaluated. The objectives use student-friendly language, though connections between objectives and instructional materials may not always be explicitly stated.", two: "The course excels in providing specific, measurable learning objectives that are fully integrated into the course structure. Objectives use action-oriented verbs that encourage higher-order thinking and are explicitly aligned with assessments, instructional materials, and course activities. A course map or alignment matrix clearly demonstrates how objectives connect to assessments." },
    { zero: "The course lists some required learning materials and technology tools, but the list may be incomplete or difficult to locate. Students may struggle to determine which materials are necessary for success. Important information about accessibility, pricing, or technology requirements is missing.", one: "The course clearly lists all required learning materials and technology tools, as well as costs (if any) in the syllabus and course site. Students have access to instructions or links for obtaining resources, and most materials are organized within modules. Some accessibility considerations are addressed.", two: "The course provides a well-organized approach to listing and structuring learning materials and technology requirements. A dedicated section outlines all required materials, including cost, access instructions, and technical support. Each resource is clearly connected to learning objectives and/or activities, reinforcing its purpose and inclusion in the course." },
    { zero: "The course provides general information about office hours and communication preferences, but details may be unclear or difficult to locate. Response time expectations are not specified or are inconsistently enforced. Limited or no alternative communication methods are provided.", one: "The course clearly states office hours, communication preferences, and response times in the syllabus and course site. Students have at least one reliable method to contact the instructor. Office hours are scheduled and communicated in advance, and the instructor follows the stated response time policy.", two: "The course provides a clear communication plan, ensuring students have multiple ways to connect with the instructor. Office hours are available in various formats and communicated in advance. A dedicated course section outlines contact details, response times, and inquiry guidelines. Alternative communication methods are available for students with disabilities or those in different time zones." },
    { zero: "The course provides some technical support resources, but they may be incomplete, difficult to locate, or not clearly explained. Common technical issues are not addressed, leaving students without clear guidance on troubleshooting. System requirements for accessing course materials may not be specified.", one: "The course includes clearly listed technical support resources in the syllabus and course site, providing students with accessible ways to seek help. Common technical issues are addressed with general troubleshooting guidance, and system requirements are specified, though some details may need refinement.", two: "The course excels in providing a well-structured technical support system. A dedicated support section offers direct links to IT resources, troubleshooting guides, FAQs, and system requirements. Common technical issues are clearly addressed with step-by-step solutions, and guidance on support for assistive technology is provided." },
    { zero: "The course references required technologies, but step-by-step guides or tutorials are missing or difficult to find. Students may struggle with technology use due to a lack of structured guidance. Support for troubleshooting issues is limited or not provided.", one: "The course provides clear documentation for required technologies, including access to official support resources. Some tutorials or step-by-step guides are available, though they may not be fully integrated into the course structure. Basic troubleshooting information is included.", two: "The course excels in providing comprehensive, easy-to-follow guidance on all required technologies. A dedicated section includes step-by-step guides and video resources. Technology tutorials are integrated within the course at the point of need and provided in multiple formats. Students are given opportunities to practice using tools before applying them in graded assignments." },
    { zero: "The course includes grading policies, academic integrity expectations, or late submission policies, but they may be incomplete, vague, or difficult to locate. Students may not fully understand how their work will be graded. Policies may be inconsistently applied, leading to confusion.", one: "Grading policies, academic integrity expectations, and late work policies are clearly stated in the syllabus and course site. Students understand how their work will be graded, and academic integrity guidelines provide general expectations. Policies are applied consistently, though some areas may need additional clarification.", two: "The course provides a fully transparent and structured grading system. Academic integrity expectations are clearly defined, with real-world examples or case studies provided for clarity. Late work policies are explicit, including procedures for requesting extensions if applicable." },

    { zero: "The gradebook is incomplete, missing some assessments, or inconsistently updated. Students may struggle to understand their grades or track their progress due to missing information or unclear organization.", one: "The gradebook includes all assessments and is clearly structured, allowing students to view their grades and progress. Some refinements may be needed, such as improving naming consistency, adding more detailed feedback, or ensuring all grading policies are reflected.", two: "The gradebook is fully organized, transparent, and aligned with all course assessments. Assessments are consistently labeled, clearly categorized, and updated regularly. Students can easily track their progress, understand grading calculations, and access timely feedback." },
    { zero: "The course includes few or no formative, low-stakes assessments. Students have limited opportunities to engage with the material outside of major assignments or exams, making it difficult to gauge their understanding before high-stakes assessments.", one: "The course integrates formative, low-stakes assessments that allow students to engage with content and check their understanding. Some assessments provide feedback, though additional opportunities or refinements could further enhance engagement and learning.", two: "The course effectively integrates a variety of formative, low-stakes assessments throughout the learning experience. Students engage in knowledge checks, discussions, interactive activities, and reflection exercises that reinforce learning. Feedback is provided consistently, and activities are thoughtfully designed to align with course objectives." },
    { zero: "Summative assessments are included in the course, but they are not scaffolded. Students receive minimal guidance or practice before major assignments, and feedback opportunities are limited or absent.", one: "The course includes some scaffolding for summative assessments, such as drafts, feedback opportunities, or practice activities. Some elements of structured support are present, but additional refinements could improve clarity and effectiveness.", two: "The course fully integrates a scaffolded approach to summative assessments, ensuring students develop the necessary skills and knowledge over time. Major assignments are broken into meaningful stages, with feedback, revision opportunities, and aligned practice activities that prepare students for success." },

    { zero: "The course includes some assignments and assessments, but rubrics are missing or inconsistently provided. Students may lack clear grading expectations, leading to confusion about performance standards.", one: "Most assignments and assessments include rubrics that outline grading expectations. Rubrics provide structured evaluation criteria, though some areas may need further refinement for clarity, consistency, or alignment with learning objectives.", two: "The course fully integrates rubrics for all assignments and assessments, ensuring that students have clear, structured, and accessible grading criteria. Rubrics are detailed, aligned with learning objectives, and consistently formatted. Students can review rubrics before submitting work." },
    { zero: "The course workload is unevenly distributed, with excessive demands in some areas and minimal engagement in others. Assignments may be clustered too closely together, or students may struggle to balance their workload effectively.", one: "The course workload is appropriate for the course level and discipline, with a structured distribution of assignments and assessments. Some refinements may be needed to further balance workload pacing or ensure alignment with institutional credit-hour expectations.", two: "The course workload is intentionally designed to be balanced, rigorous, and aligned with course objectives. Assignments and activities are evenly distributed across the term. Workload expectations are clearly communicated, aligned with credit hours, and structured to promote sustained learning." },
    { zero: "The course contains broken links, spelling errors, or outdated information that may cause confusion. Some materials may be difficult to access or contain inaccuracies, impacting student learning.", one: "The course materials are mostly free of errors, and nearly all links and resources function correctly. Any remaining issues are minor and do not significantly disrupt student learning.", two: "The course materials are fully accurate, functional, and professionally presented. All links work as intended, spelling and grammar are correct, and information is fully up to date. There are no noticeable errors, inconsistencies, or outdated resources." },

const SCORE_LABELS = { 0: "Developing", 1: "Accomplished", 2: "Exemplary" };
const SCORE_DESCRIPTIONS = { 0: "Does not meet the objective.", 1: "Adequately meets the objective.", 2: "Thoroughly meets the objective." };

function sumScores(scores) { return Object.values(scores).reduce((a, b) => a + (b ?? 0), 0); }
function scoreColor(s) { return s === 0 ? C.scoreZero : s === 1 ? C.scoreOne : C.scoreTwo; }

async function callClaude(prompt) {
  const response = await fetch("https://olc-scorecard-proxy.briana-schwartz.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages: [{ role: "user", content: prompt }] }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(`API ${response.status}: ${JSON.stringify(data)}`);
  const text = data.content?.[0]?.text;
  if (!text) throw new Error(`Unexpected shape: ${JSON.stringify(data)}`);
  return text;
}

function CriteriaTooltip({ sectionId, index }) {
  const [open, setOpen] = useState(false);
  const btnRef = useRef(null);
  const popRef = useRef(null);
  const criteria = HANDBOOK[sectionId]?.[index];

  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (popRef.current && !popRef.current.contains(e.target) && !btnRef.current.contains(e.target)) setOpen(false); };
    const keyHandler = (e) => { if (e.key === "Escape") { setOpen(false); btnRef.current?.focus(); } };
    document.addEventListener("mousedown", handler);
    document.addEventListener("keydown", keyHandler);
    return () => { document.removeEventListener("mousedown", handler); document.removeEventListener("keydown", keyHandler); };
  }, [open]);

  useEffect(() => { if (open) popRef.current?.focus(); }, [open]);
  if (!criteria) return null;

  return (
    <span style={{ position: "relative", display: "inline-flex", alignItems: "center", marginLeft: 6 }}>
      <button ref={btnRef} onClick={() => setOpen(v => !v)} aria-expanded={open} aria-label="View scoring criteria"
        style={{ background: "none", border: `1.5px solid ${C.teal}`, borderRadius: "50%", width: 20, height: 20, display: "inline-flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.teal, fontSize: 11, fontWeight: 800, padding: 0, flexShrink: 0, lineHeight: 1 }}>
        i
      </button>
      {open && (
        <div ref={popRef} role="dialog" aria-label="Scoring criteria" tabIndex={-1}
          style={{ position: "absolute", left: 0, top: 28, zIndex: 100, width: 340, background: C.white, border: `2px solid ${C.navy}`, borderRadius: 8, boxShadow: "0 4px 20px rgba(0,0,0,0.18)", padding: "14px 16px", outline: "none" }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: C.textSecondary, textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 0, marginBottom: 10 }}>Scoring criteria</p>
          {[{ label: "0 – Developing", text: criteria.zero, color: C.scoreZero, bg: "#FFF0EE" }, { label: "1 – Accomplished", text: criteria.one, color: C.scoreOne, bg: "#FFF8E6" }, { label: "2 – Exemplary", text: criteria.two, color: C.scoreTwo, bg: "#EEF7F1" }].map(({ label, text, color, bg }) => (
            <div key={label} style={{ background: bg, border: `1px solid ${color}`, borderRadius: 6, padding: "8px 10px", marginBottom: 8 }}>
              <p style={{ fontSize: 11, fontWeight: 700, color, margin: "0 0 4px 0", textTransform: "uppercase", letterSpacing: "0.04em" }}>{label}</p>
              <p style={{ fontSize: 12, color: C.textPrimary, margin: 0, lineHeight: 1.55 }}>{text}</p>

        </div>

  );
}

      <div role="progressbar" aria-valuenow={value} aria-valuemin={0} aria-valuemax={max} aria-label={`${label}: ${value} of ${max} points`}

        <div style={{ height: "100%", width: `${pct}%`, background: barColor, borderRadius: 99, transition: "width 0.3s ease" }} />

function SectionView({ section, scores, onScoreChange, notes, onNoteChange, strengths, weaknesses, onStrengthsChange, onWeaknessesChange, onNext, onBack, isLast, courseInfo }) {
  const [draftingStrengths, setDraftingStrengths] = useState(false);
  const [draftingWeaknesses, setDraftingWeaknesses] = useState(false);
  const headingRef = useRef(null);
  useEffect(() => { headingRef.current?.focus(); }, [section.id]);

  const sectionScore = sumScores(scores);
  const scoredCount = Object.values(scores).filter(v => v !== null && v !== undefined).length;
  const noteThreshold = section.objectives.length >= 20 ? 3 : 2;
  const notesCount = Object.values(notes).filter(n => n?.trim().length > 0).length;
  const canDraft = notesCount >= noteThreshold;

  const buildPrompt = (type) => {
    const relevant = section.objectives.map((obj, i) => {
      const s = scores[i]; const note = notes[i]?.trim();
      if (s === null || s === undefined) return null;
      return `${i + 1}. [${s} – ${SCORE_LABELS[s]}] ${obj}${note ? ` | Evidence: "${note}"` : ""}`;
    }).filter(Boolean).join("\n");
    const focus = type === "strengths"
      ? "Focus on the highest-scoring objectives. Where evidence notes exist, reference them specifically. Be affirming and concrete."
      : "Focus on the lowest-scoring objectives. Where evidence notes exist, reference them to make suggestions actionable. Be constructive and encouraging.";
    return `You are writing a ${type === "strengths" ? "Strengths" : "Areas for Improvement"} narrative for an OLC Course Review Scorecard self-assessment.\n\nSection: ${section.label}\nInstructor: ${courseInfo.instructorName}\nCourse: ${courseInfo.courseName}\nSection score: ${sectionScore}/${section.maxScore}\n\nScored objectives:\n${relevant}\n\n${focus}\n\nWrite 3–5 sentences in second person, flowing prose, no bullet points. Do not mention numeric scores.`;
  };

  const draftStrengths = async () => {
    setDraftingStrengths(true);
    try { onStrengthsChange(await callClaude(buildPrompt("strengths"))); }
    catch (e) { onStrengthsChange("Unable to generate draft. Please write your own narrative here."); }
    setDraftingStrengths(false);
  };
  const draftWeaknesses = async () => {
    setDraftingWeaknesses(true);
    try { onWeaknessesChange(await callClaude(buildPrompt("improvements"))); }
    catch (e) { onWeaknessesChange("Unable to generate draft. Please write your own narrative here."); }
    setDraftingWeaknesses(false);
  };

  return (
    <div style={{ maxWidth: 740, margin: "0 auto" }}>
      <h2 ref={headingRef} tabIndex={-1} style={{ fontSize: 24, fontWeight: 800, color: C.navy, marginBottom: 4, outline: "none" }}>{section.label}</h2>
      <p style={{ fontSize: 14, color: C.textSecondary, lineHeight: 1.6, marginBottom: 20 }}>{section.description}</p>

      {section.id === "delivery" && (
        <div role="note" style={{ background: "#FFF8E6", border: `1px solid ${C.scoreOne}`, borderRadius: 8, padding: "12px 16px", marginBottom: 20, fontSize: 13, color: "#5C3D00", lineHeight: 1.6 }}>
          <strong>Reminder:</strong> Complete this section only after teaching the course. When writing narrative commentary, describe patterns and practices rather than specific student situations. Do not include student names or individually identifiable information.
        </div>
      )}

      <div style={{ display: "flex", gap: 16, marginBottom: 20, flexWrap: "wrap" }} role="note" aria-label="Scoring scale">
        {[0, 1, 2].map(v => (
          <div key={v} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}>
            <span style={{ display: "inline-block", width: 20, height: 20, borderRadius: 4, background: v === 0 ? "#FFF0EE" : v === 1 ? "#FFF8E6" : "#EEF7F1", border: `2px solid ${scoreColor(v)}`, flexShrink: 0 }} aria-hidden="true" />
            <span style={{ color: C.textSecondary }}><strong style={{ color: scoreColor(v) }}>{v} – {SCORE_LABELS[v]}:</strong> {SCORE_DESCRIPTIONS[v]}</span>
          </div>
        ))}
      </div>

      <p style={{ fontSize: 13, color: C.textSecondary, marginBottom: 16 }}>Select <strong>ⓘ</strong> next to any objective to see detailed scoring criteria from the OLC Course Review Handbook.</p>

      <div style={{ background: C.offWhite, border: `1px solid ${C.border}`, borderRadius: 8, padding: "12px 16px", marginBottom: 24 }}>
        <ProgressBar value={sectionScore} max={section.maxScore} label={`${section.label} score`} />
        <p aria-live="polite" aria-atomic="true" style={{ fontSize: 13, color: C.textSecondary, margin: 0 }}>{scoredCount} of {section.objectives.length} objectives scored</p>
      </div>

      <div style={{ marginBottom: 32 }}>
        {section.objectives.map((obj, i) => {
          const score = scores[i]; const hasScore = score !== null && score !== undefined;
          return (
            <div key={i} style={{ background: C.white, border: `1px solid ${hasScore ? scoreColor(score) : C.border}`, borderLeft: `4px solid ${hasScore ? scoreColor(score) : C.border}`, borderRadius: 6, padding: "14px 16px", marginBottom: 10, transition: "border-color 0.2s" }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start", flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: C.textSecondary, minWidth: 24, paddingTop: 2, flexShrink: 0 }} aria-hidden="true">{i + 1}.</span>
                <p id={`obj-${section.id}-${i}`} style={{ flex: 1, margin: 0, fontSize: 14, color: C.textPrimary, lineHeight: 1.6, minWidth: 200 }}>
                  {obj}<CriteriaTooltip sectionId={section.id} index={i} />
                </p>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 12, paddingLeft: 34, flexWrap: "wrap" }} role="group" aria-labelledby={`obj-${section.id}-${i}`}>
                {[0, 1, 2].map(v => <ScoreButton key={v} value={v} selected={score === v} onChange={(val) => onScoreChange(i, val)} objectiveIndex={`${section.id}-${i}`} />)}
              </div>
              <div style={{ marginTop: 10, paddingLeft: 34 }}>
                <label htmlFor={`note-${section.id}-${i}`} style={{ display: "block", fontSize: 12, fontWeight: 600, color: C.textSecondary, marginBottom: 4 }}>
                  Evidence / notes <span style={{ fontWeight: 400 }}>(optional)</span>
                </label>
                <textarea id={`note-${section.id}-${i}`} value={notes[i] ?? ""} onChange={(e) => onNoteChange(i, e.target.value)} rows={2}
                  placeholder="What in your course informed this rating? e.g., syllabus language, a specific page, an assignment description."
                  style={{ width: "100%", padding: "7px 10px", border: `1.5px solid ${C.border}`, borderRadius: 5, fontSize: 13, color: C.textPrimary, resize: "vertical", fontFamily: "inherit", lineHeight: 1.5, boxSizing: "border-box", background: C.offWhite }}
                  onFocus={(e) => { e.target.style.borderColor = C.focus; e.target.style.background = C.white; }}
                  onBlur={(e) => { e.target.style.borderColor = C.border; e.target.style.background = C.offWhite; }} />
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ background: C.offWhite, border: `1px solid ${C.border}`, borderRadius: 8, padding: "20px", marginBottom: 32 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, color: C.navy, marginBottom: 4, marginTop: 0 }}>Section narrative</h3>
        <p style={{ fontSize: 13, color: C.textSecondary, marginBottom: 12, marginTop: 0, lineHeight: 1.6 }}>
          You can write your own narrative at any time. To use the draft buttons, add evidence notes to at least {noteThreshold} objectives above.
        </p>
        <div role="status" aria-live="polite" aria-atomic="true"
          style={{ display: "inline-flex", alignItems: "center", gap: 8, background: canDraft ? "#EEF7F1" : C.white, border: `1.5px solid ${canDraft ? C.scoreTwo : C.border}`, borderRadius: 6, padding: "6px 12px", marginBottom: 16, fontSize: 13, color: canDraft ? C.scoreTwo : C.textSecondary, fontWeight: 600 }}>
          <span aria-hidden="true">{canDraft ? "✓" : "○"}</span>
          {notesCount} of {noteThreshold} evidence notes added{canDraft ? " — drafting enabled" : ` — add ${noteThreshold - notesCount} more to enable drafting`}
        </div>
        <div className="no-print">
          <DraftButton onClick={draftStrengths} loading={draftingStrengths} label="Draft strengths" disabled={!canDraft} />
        </div>
        <NarrativeField id={`strengths-${section.id}`} label="Strengths" value={strengths} onChange={onStrengthsChange} />
        <div className="no-print">
          <DraftButton onClick={draftWeaknesses} loading={draftingWeaknesses} label="Draft areas for improvement" disabled={!canDraft} />
        </div>
        <NarrativeField id={`improvements-${section.id}`} label="Areas for improvement" value={weaknesses} onChange={onWeaknessesChange} />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", gap: 12 }} className="no-print">
        <button onClick={onBack} style={{ padding: "11px 22px", background: C.white, color: C.navy, border: `2px solid ${C.navy}`, borderRadius: 6, fontSize: 15, fontWeight: 600, cursor: "pointer" }}>← Back</button>
        <button onClick={onNext} style={{ padding: "11px 28px", background: C.navy, color: C.white, border: "none", borderRadius: 6, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
          {isLast ? "View summary →" : "Next section →"}
        </button>
      </div>
    </div>
  );
}

function SummaryView({ courseInfo, allScores, narratives, onBack }) {
  const [improvementPlan, setImprovementPlan] = useState("");
  const [draftingPlan, setDraftingPlan] = useState(false);
  const headingRef = useRef(null);
  useEffect(() => { headingRef.current?.focus(); }, []);

  const sectionTotals = SECTIONS.map(s => sumScores(allScores[s.id]));
  const total = sectionTotals.reduce((a, b) => a + b, 0);
  const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

  const draftPlan = async () => {
    setDraftingPlan(true);
    const allObjectives = SECTIONS.flatMap(s => s.objectives.map((obj, i) => ({ section: s.label, objective: obj, score: allScores[s.id][i] }))).filter(o => o.score !== null && o.score !== undefined);
    const lowScoring = allObjectives.filter(o => o.score < 2).sort((a, b) => a.score - b.score);
    const list = lowScoring.map(o => `- [${o.section}] Score ${o.score} – ${SCORE_LABELS[o.score]}: ${o.objective}`).join("\n");
    const prompt = `You are helping an instructor complete a course self-assessment using the OLC Course Review Scorecard.\n\nInstructor: ${courseInfo.instructorName}\nCourse: ${courseInfo.courseName}\nTotal score: ${total}/100\n\nObjectives not yet rated Exemplary:\n${list || "All scored objectives were rated Exemplary."}\n\nWrite a concise, encouraging improvement plan (4–6 sentences) that acknowledges overall performance, identifies 2–3 high-priority areas, suggests concrete next steps, and ends on a forward-looking note. Second person, flowing prose, no bullet points, no explicit score numbers.`;
    try { setImprovementPlan(await callClaude(prompt)); }
    catch (e) { setImprovementPlan("Unable to generate draft. Please write your improvement plan here."); }
    setDraftingPlan(false);
  };

  return (
    <div style={{ maxWidth: 720, margin: "0 auto" }} id="print-root">
      <div className="print-only">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24, borderBottom: `3px solid ${C.navy}`, paddingBottom: 16 }}>
          <div>
            <h1 style={{ fontSize: 22, fontWeight: 800, color: C.navy, margin: 0 }}>OLC Course Review Scorecard</h1>
            <p style={{ margin: "4px 0 0", fontSize: 13, color: C.textSecondary }}>Self-Assessment Report</p>
          </div>
          <div style={{ textAlign: "right", fontSize: 13, color: C.textSecondary }}>
            <div><strong>{courseInfo.instructorName}</strong></div>
            <div>{courseInfo.courseName}</div>
            <div>{today}</div>
          </div>
        </div>
      </div>

      <h2 ref={headingRef} tabIndex={-1} className="screen-only" style={{ fontSize: 24, fontWeight: 800, color: C.navy, marginBottom: 4, outline: "none" }}>Scorecard summary</h2>
      <p className="screen-only" style={{ fontSize: 14, color: C.textSecondary, marginBottom: 24 }}>{courseInfo.instructorName} · {courseInfo.courseName} · {today}</p>

      <div style={{ marginBottom: 28 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 15 }} aria-label="Scorecard summary">
          <thead>
            <tr style={{ background: C.navy }}>
              <th scope="col" style={{ padding: "10px 14px", color: C.white, textAlign: "left", fontWeight: 700, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.05em" }}>Section</th>
              <th scope="col" style={{ padding: "10px 14px", color: C.white, textAlign: "right", fontWeight: 700, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.05em" }}>Score</th>
            </tr>
          </thead>
          <tbody>
            {SECTIONS.map((s, i) => (
              <tr key={s.id} style={{ background: i % 2 === 0 ? C.white : C.offWhite }}>
                <td style={{ padding: "10px 14px", color: C.textPrimary, borderBottom: `1px solid ${C.border}` }}>{s.label} <span style={{ color: C.textSecondary, fontSize: 13 }}>({s.maxScore} pts)</span></td>
                <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 700, color: C.textPrimary, borderBottom: `1px solid ${C.border}` }}>{sectionTotals[i]}</td>
              </tr>
            ))}
            <tr style={{ background: C.navy }}>
              <td style={{ padding: "12px 14px", color: C.white, fontWeight: 800, fontSize: 16 }}>Total</td>
              <td style={{ padding: "12px 14px", color: C.white, fontWeight: 800, fontSize: 18, textAlign: "right" }}>{total} / 100</td>
            </tr>
          </tbody>
        </table>
        <div style={{ marginTop: 16 }}>
          {SECTIONS.map((s, i) => <ProgressBar key={s.id} value={sectionTotals[i]} max={s.maxScore} label={s.label} />)}
        </div>
      </div>

      {SECTIONS.map(s => (
        <div key={s.id} style={{ marginBottom: 28 }}>
          <h3 style={{ fontSize: 17, fontWeight: 800, color: C.navy, marginBottom: 12, paddingBottom: 8, borderBottom: `2px solid ${C.teal}` }}>{s.label}</h3>
          <div style={{ marginBottom: 12 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: C.textSecondary, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>Strengths</p>
            <p style={{ fontSize: 14, color: C.textPrimary, lineHeight: 1.7, margin: 0, whiteSpace: "pre-wrap" }}>{narratives[s.id]?.strengths || <em style={{ color: C.textSecondary }}>No narrative recorded.</em>}</p>
          </div>
          <div>
            <p style={{ fontSize: 13, fontWeight: 700, color: C.textSecondary, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>Areas for improvement</p>
            <p style={{ fontSize: 14, color: C.textPrimary, lineHeight: 1.7, margin: 0, whiteSpace: "pre-wrap" }}>{narratives[s.id]?.weaknesses || <em style={{ color: C.textSecondary }}>No narrative recorded.</em>}</p>
          </div>
        </div>
      ))}

      <div style={{ marginBottom: 32 }}>
        <h3 style={{ fontSize: 17, fontWeight: 800, color: C.navy, marginBottom: 8, paddingBottom: 8, borderBottom: `2px solid ${C.teal}` }}>Improvement plan</h3>
        <div className="no-print">
          <DraftButton onClick={draftPlan} loading={draftingPlan} label="Draft improvement plan" />
        </div>
        <textarea id="improvement-plan" aria-label="Improvement plan" value={improvementPlan} onChange={(e) => setImprovementPlan(e.target.value)} rows={6} className="print-hide no-print"
          placeholder="Describe your plan for improving this course based on your self-assessment results…"
          style={{ width: "100%", padding: "10px 12px", border: `2px solid ${C.border}`, borderRadius: 6, fontSize: 14, color: C.textPrimary, resize: "vertical", fontFamily: "inherit", lineHeight: 1.6, boxSizing: "border-box" }}
          onFocus={(e) => (e.target.style.borderColor = C.focus)} onBlur={(e) => (e.target.style.borderColor = C.border)} />
        <p className="print-only" style={{ fontSize: 14, color: C.textPrimary, lineHeight: 1.7, margin: 0, whiteSpace: "pre-wrap" }}>{improvementPlan || <em style={{ color: C.textSecondary }}>No improvement plan recorded.</em>}</p>
      </div>

      <div style={{ display: "flex", gap: 12, justifyContent: "space-between", flexWrap: "wrap" }} className="no-print">
        <button onClick={onBack} style={{ padding: "11px 22px", background: C.white, color: C.navy, border: `2px solid ${C.navy}`, borderRadius: 6, fontSize: 15, fontWeight: 600, cursor: "pointer" }}>← Back</button>
        <button onClick={() => window.print()} style={{ padding: "11px 28px", background: C.teal, color: C.white, border: "none", borderRadius: 6, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>Print / Save as PDF</button>
      </div>
    </div>
  );
}

function App() {
  const [step, setStep] = useState(0);
  const [courseInfo, setCourseInfo] = useState(null);
  const initScores = (s) => Object.fromEntries(s.objectives.map((_, i) => [i, null]));
  const initNotes = (s) => Object.fromEntries(s.objectives.map((_, i) => [i, ""]));
  const [scores, setScores] = useState({ essential: initScores(SECTIONS[0]), advanced: initScores(SECTIONS[1]), delivery: initScores(SECTIONS[2]) });
  const [narratives, setNarratives] = useState({ essential: { strengths: "", weaknesses: "" }, advanced: { strengths: "", weaknesses: "" }, delivery: { strengths: "", weaknesses: "" } });
  const [notes, setNotes] = useState({ essential: initNotes(SECTIONS[0]), advanced: initNotes(SECTIONS[1]), delivery: initNotes(SECTIONS[2]) });

  const updateScore = (sid, i, v) => setScores(p => ({ ...p, [sid]: { ...p[sid], [i]: v } }));
  const updateNote = (sid, i, v) => setNotes(p => ({ ...p, [sid]: { ...p[sid], [i]: v } }));
  const updateNarrative = (sid, field, v) => setNarratives(p => ({ ...p, [sid]: { ...p[sid], [field]: v } }));

  const summaryStep = courseInfo?.courseTaught ? 4 : 3;
  const allSteps = courseInfo?.courseTaught
    ? ["Start", "Essential Design", "Advanced Design", "Course Delivery", "Summary"]
    : ["Start", "Essential Design", "Advanced Design", "Summary"];

  const getSectionForStep = (s) => { if (s === 1) return SECTIONS[0]; if (s === 2) return SECTIONS[1]; if (s === 3 && courseInfo?.courseTaught) return SECTIONS[2]; return null; };
  const currentSection = getSectionForStep(step);

  return (
    <>
      <header style={{ background: C.navy, padding: "0 24px", display: "flex", alignItems: "center", height: 56 }} className="no-print">
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ background: C.teal, borderRadius: 4, padding: "3px 8px", fontSize: 13, fontWeight: 800, color: C.white, letterSpacing: "0.06em" }} aria-hidden="true">OLC</div>
          <span style={{ color: C.white, fontWeight: 600, fontSize: 15 }}>Course Review Scorecard</span>
        </div>
      </header>

      <main id="main-content" style={{ padding: "32px 24px", minHeight: "calc(100vh - 56px - 48px)" }}>
        {step > 0 && courseInfo && <StepIndicator steps={allSteps} currentStep={step} />}
        {step === 0 && <WelcomeView onStart={(info) => { setCourseInfo(info); setStep(1); }} />}
        {step > 0 && step < summaryStep && currentSection && (
          <SectionView section={currentSection} scores={scores[currentSection.id]} onScoreChange={(i, v) => updateScore(currentSection.id, i, v)}
            notes={notes[currentSection.id]} onNoteChange={(i, v) => updateNote(currentSection.id, i, v)}
            strengths={narratives[currentSection.id].strengths} weaknesses={narratives[currentSection.id].weaknesses}
            onStrengthsChange={(v) => updateNarrative(currentSection.id, "strengths", v)}
            onWeaknessesChange={(v) => updateNarrative(currentSection.id, "weaknesses", v)}
            onNext={() => setStep(s => s + 1)} onBack={() => setStep(s => s - 1)}
            isLast={step === summaryStep - 1} courseInfo={courseInfo} />
        )}
        {step === summaryStep && <SummaryView courseInfo={courseInfo} allScores={scores} narratives={narratives} onBack={() => setStep(s => s - 1)} />}
      </main>

      <footer style={{ background: C.navyDark, padding: "12px 24px", fontSize: 12, color: "rgba(255,255,255,0.6)", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }} className="no-print">
        <span>Based on the OLC Center for Quality Initiatives Course Review Scorecard (CC BY-NC-SA)</span>
        <span>Your responses are not stored or transmitted.</span>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
